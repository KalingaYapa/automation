# ==========================================================================
#  Automation configuration - one place for everything that varies.
#  Nothing that changes between environments belongs in the Java code.
#  Credentials are left blank on purpose: fill them in locally, never commit.
# ==========================================================================

# Name shown on the reports
projectName=Sample Project

# Application under test - keep the trailing slash
appURL=https://example.com/app/

# --- Credentials (fill in locally, never commit) ---
username=
password=

# Browser used when a suite does not pass the "browser" parameter: chrome | edge | firefox
browser=chrome

# yes = run the browser headless (useful on CI)
headless=no

# yes = email the Extent + Excel reports at the end of the suite (see b_utilities.TestConfig)
email=no

# yes = print a debug line per navigation and click
debug=no

# Waits, in seconds
explicitWaitSeconds=20
implicitWaitSeconds=10
pageLoadTimeoutSeconds=60

# --- Test data -----------------------------------------------------------
# Values the tests use. Add one key per value that varies, rather than
# writing it into a test method.
sampleSearchValue=Alpha
sampleInvalidSearchValue=ZZZNOMATCH

# Document editor title-bar checks (DocumentEditor.xml)
# Locally set appURL to the editor URL described in docs/document-editor-tests.md.
expectedDocumentTitle=11.1 - Transmit Flight and Shipment Information to Down-line Stations & Authorities
savedTimePattern=Last Saved (?:0?[1-9]|1[0-2]):[0-5][0-9] [AP]M

# Existing bold word used by the read-only formatting checks
boldSampleText=Depending

# Heading fixture for applying bold (must initially have Bold off)
editorHeadingText=Transmit Flight and Shipment Information to Down-line Stations & Authorities
headingWord=Transmit

# Paragraph used by the Selected Element synchronisation checks
editorParagraphText=Close the flight in the Handling system. By this action, the (X)FFM is transmitted.
